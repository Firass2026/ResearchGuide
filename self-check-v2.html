<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفحص الذاتي</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial;background:#edf8f8;color:#24384a}.bar{height:72px;background:#fff;border-bottom:1px solid #dcebea;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-weight:800;font-size:22px;color:#143f62}.back{color:#087f7b;text-decoration:none}.hero{max-width:1500px;margin:18px auto;min-height:570px;display:grid;grid-template-columns:1fr 1fr;align-items:center;background:#fff}.copy{padding:55px}.copy h1{font-size:clamp(45px,6vw,78px);color:#153f61;margin:0 0 24px}.copy p{font-size:24px;line-height:1.9;color:#5b6d77}.visual{background:linear-gradient(145deg,#e0f1ef,#f6fbfa);height:100%;display:grid;place-items:center;padding:45px}.clip{width:min(420px,90%);background:#fff;border-radius:8px;padding:35px;box-shadow:0 12px 30px #0002;border-top:16px solid #0b9e9a}.line{display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #dbe9e8;font-weight:700}.tick{width:28px;height:28px;background:#0b9e9a;color:#fff;border-radius:5px;display:grid;place-items:center}@media(max-width:800px){.hero{grid-template-columns:1fr}.copy{padding:35px;text-align:center}.visual{min-height:420px}}</style></head><body><header class="bar"><div class="brand">منصة إعداد وتقييم البحوث العلمية</div><a class="back" href="./index.html">العودة إلى الرئيسية</a></header><main class="hero"><section class="copy"><h1>الفحص الذاتي ✅</h1><p>راجع بحثك قبل تقديمه وتحقق من استيفاء المتطلبات</p></section><section class="visual"><div class="clip"><div class="line"><span class="tick">✓</span>استيفاء عنوان البحث</div><div class="line"><span class="tick">✓</span>وضوح مشكلة البحث</div><div class="line"><span class="tick">✓</span>سلامة المنهجية</div><div class="line"><span class="tick">✓</span>توثيق المصادر والمراجع</div><div class="line"><span class="tick">✓</span>النتائج والتوصيات</div></div></section></main></body></html>
