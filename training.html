<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المرجع التدريبي | منصة إعداد وتقييم البحوث العلمية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial;background:#f4f8f9;color:#182b38}
header{background:linear-gradient(135deg,#063b70,#087fc9);color:#fff;padding:18px 6%;box-shadow:0 4px 16px #0002}.nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.back{color:#fff;border:1px solid #ffffff66;padding:9px 17px;border-radius:999px}
main{min-height:calc(100vh - 90px);padding:70px 6%;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(circle at 50% 10%,#ffffff 0,#edf7f7 55%,#f8fbfc 100%)}
.hero{width:min(1200px,100%);min-height:520px;padding:55px 7%;display:grid;grid-template-columns:1fr 1.35fr;gap:45px;align-items:center;background:linear-gradient(135deg,#eaf7f7,#fdfefe);border-radius:12px}
.copy{text-align:right}.copy h1{font-size:clamp(38px,5vw,62px);margin:0 0 35px;line-height:1.35}.copy p{font-size:clamp(22px,2.5vw,34px);font-weight:700;line-height:1.7;margin:0}
.visual{height:400px;border-radius:5px;background:linear-gradient(135deg,#607da1,#b9bec0,#8980aa);box-shadow:0 8px 25px #17324d20}
@media(max-width:800px){.nav{flex-direction:column;align-items:flex-start;gap:12px}.hero{grid-template-columns:1fr;min-height:auto}.visual{height:280px}.copy{text-align:center}}
</style></head>
<body><header><div class="nav"><div class="brand">منصة إعداد وتقييم البحوث العلمية</div><a class="back" href="./index.html">العودة إلى الرئيسية</a></div></header>
<main><section class="hero"><div class="copy"><h1>المرجع التدريبي 📘</h1><p>دليل عملي لإعداد البحث العلمي واجتياز معايير التقييم</p></div><div class="visual" aria-label="المادة المرئية للمرجع التدريبي"></div></section></main>
</body></html>
