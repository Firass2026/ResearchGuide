<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقديم البحث | منصة إعداد وتقييم البحوث العلمية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial;background:#f7f8f9;color:#182b38}
header{background:linear-gradient(135deg,#063b70,#087fc9);color:#fff;padding:18px 6%;box-shadow:0 4px 16px #0002}.nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.back{color:#fff;border:1px solid #ffffff66;padding:9px 17px;border-radius:999px}
main{padding:0 6% 70px}.hero{max-width:1300px;margin:auto;min-height:220px;padding:60px 8%;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#f1f2f3,#fff);border-bottom:1px solid #eee}.title h1{font-size:clamp(45px,6vw,72px);margin:0 0 15px}.action{background:#078d95;color:#fff;padding:12px 22px;font-weight:800;border-radius:4px}.author{margin-top:28px;font-weight:700}.image{max-width:1100px;margin:30px auto 0;border-radius:6px;overflow:hidden;box-shadow:0 12px 30px #0002;background:linear-gradient(135deg,#eef3f7,#fff)}.image .screen{display:grid;grid-template-columns:1fr 1.2fr;min-height:430px}.panel{padding:40px;background:linear-gradient(160deg,#f4f9ff,#e8f4ff)}.panel h2{color:#087fc9;font-size:40px;margin:0 0 30px}.check{display:flex;gap:12px;align-items:center;font-size:20px;font-weight:700;padding:14px 0;border-bottom:1px solid #d5e1eb}.check:before{content:"✓";background:#1689ef;color:#fff;border-radius:4px;padding:1px 8px}.upload{display:flex;align-items:center;justify-content:center;font-size:110px;background:linear-gradient(135deg,#eaf7ff,#fff)}
@media(max-width:800px){.nav{flex-direction:column;align-items:flex-start;gap:12px}.hero{flex-direction:column;align-items:flex-start;gap:25px}.image .screen{grid-template-columns:1fr}.upload{min-height:220px}}
</style></head>
<body><header><div class="nav"><div class="brand">منصة إعداد وتقييم البحوث العلمية</div><a class="back" href="./index.html">العودة إلى الرئيسية</a></div></header>
<main><section class="hero"><div class="title"><h1>تقديم البحث 📤</h1><div class="action">إرسال البحث والبيانات المطلوبة إلى اللجنة</div><div class="author">الباحث</div></div></section>
<section class="image"><div class="screen"><div class="panel"><h2>تقديم البحث</h2><div class="check">إرسال البحث</div><div class="check">البيانات المطلوبة</div><div class="check">المرفقات</div><div class="check">التأكيد والإرسال</div></div><div class="upload">☁️</div></div></section></main>
</body></html>
