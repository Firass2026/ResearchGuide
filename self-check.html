<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الفحص الذاتي | منصة إعداد وتقييم البحوث العلمية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial;background:#f4f8f9;color:#182b38}
header{background:linear-gradient(135deg,#063b70,#0b9e9a);color:#fff;padding:18px 6%;box-shadow:0 4px 16px #0002}.nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.back{color:#fff;border:1px solid #ffffff66;padding:9px 17px;border-radius:999px}
main{min-height:calc(100vh - 90px);padding:60px 6%;display:flex;justify-content:center;background:radial-gradient(circle at 50% 10%,#fff,#eaf8f8 60%,#fff)}
.hero{width:min(1200px,100%);min-height:600px;display:grid;grid-template-columns:1fr 1.35fr;gap:55px;align-items:center;padding:55px 8%;background:linear-gradient(135deg,#e9f7f7,#fff);border-radius:10px}.copy{text-align:right}.icon{font-size:76px;margin-bottom:20px}.copy h1{font-size:clamp(50px,6vw,82px);line-height:1.15;margin:0 0 35px}.copy p{font-size:25px;font-weight:600;line-height:1.8}.visual{height:420px;border-radius:5px;background:linear-gradient(135deg,#b7adae,#c8c0c0);box-shadow:0 8px 25px #17324d15}
@media(max-width:800px){.nav{flex-direction:column;align-items:flex-start;gap:12px}.hero{grid-template-columns:1fr;min-height:auto}.copy{text-align:center}.visual{height:280px}}
</style></head>
<body><header><div class="nav"><div class="brand">منصة إعداد وتقييم البحوث العلمية</div><a class="back" href="./index.html">العودة إلى الرئيسية</a></div></header>
<main><section class="hero"><div class="copy"><div class="icon">✅</div><h1>الفحص<br>الذاتي</h1><p>راجع بحثك قبل تقديمه وتحقق من استيفاء المتطلبات</p></div><div class="visual"></div></section></main>
</body></html>
