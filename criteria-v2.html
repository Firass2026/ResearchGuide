<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معايير التقييم</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial;background:#fff;color:#24384a}.bar{height:72px;background:#fff;border-bottom:1px solid #e5ebef;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{font-weight:800;font-size:22px;color:#143f62}.back{color:#176fa0;text-decoration:none}.hero{max-width:1500px;margin:18px auto;min-height:600px;display:grid;grid-template-columns:.85fr 1.15fr;align-items:center;gap:40px;padding:45px;background:linear-gradient(145deg,#f5fafb,#fff)}.copy h1{font-size:clamp(45px,6vw,78px);margin:0 0 25px;color:#153f61}.copy p{font-size:24px;line-height:1.9;color:#5a6c77}.visual{background:#fff;padding:30px;border-radius:7px;box-shadow:0 10px 35px #073b6f18}.visual h2{text-align:center;color:#073b6f;margin:0 0 20px}.row{display:flex;justify-content:space-between;padding:15px 18px;margin:10px 0;background:#f4f8fb;border-right:6px solid #1684c4;border-radius:5px;font-size:18px;font-weight:700}.score{color:#087fc9}.total{background:#fff5dc;border-right-color:#c29422}.total .score{color:#9b6d0c;font-size:24px}@media(max-width:850px){.hero{grid-template-columns:1fr;margin:0;padding:30px}.copy{text-align:center}}</style></head><body><header class="bar"><div class="brand">منصة إعداد وتقييم البحوث العلمية</div><a class="back" href="./index.html">العودة إلى الرئيسية</a></header><main class="hero"><section class="copy"><h1>معايير التقييم 📊</h1><p>معايير لجنة تقييم البحوث وفق مقياس 100 درجة</p></section><section class="visual"><h2>توزيع درجات التقييم</h2><div class="row"><span>الأصالة والابتكار</span><span class="score">20</span></div><div class="row"><span>المنهجية العلمية</span><span class="score">20</span></div><div class="row"><span>جودة البيانات والتحليل</span><span class="score">20</span></div><div class="row"><span>النتائج والتوصيات</span><span class="score">20</span></div><div class="row"><span>العرض والتنظيم</span><span class="score">20</span></div><div class="row total"><strong>المجموع</strong><strong class="score">100</strong></div></section></main></body></html>
