<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المرجع التدريبي</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial;background:#fff;color:#24384a}.bar{height:72px;border-bottom:1px solid #e5ebef;display:flex;align-items:center;justify-content:space-between;padding:0 4%;color:#143f62}.brand{font-weight:800;font-size:22px}.back{color:#176fa0;text-decoration:none;font-size:14px}.hero{margin:18px auto;max-width:1500px;min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;background:#f4f8fa;direction:ltr}.copy,.visual{direction:rtl}.copy{padding:70px 65px;display:flex;flex-direction:column;justify-content:center}.copy h1{font-size:clamp(42px,5vw,68px);color:#153f61;margin:0 0 22px}.copy p{font-size:24px;line-height:1.9;color:#536875;font-weight:600}.visual{background:linear-gradient(145deg,#dce9ef,#f8fbfc);position:relative;overflow:hidden}.books{position:absolute;left:10%;right:10%;bottom:12%;height:62%}.book{position:absolute;bottom:30%;height:42px;border-radius:4px;box-shadow:0 8px 15px #0002}.one{left:3%;width:88%;background:#297aa9;transform:rotate(-3deg)}.two{left:10%;width:76%;bottom:41%;background:#c49a2b;transform:rotate(2deg)}.three{left:17%;width:65%;bottom:52%;background:#7653a3;transform:rotate(-2deg)}.screen{position:absolute;width:47%;height:42%;left:27%;top:20%;background:#fff;border:9px solid #617c8d;border-radius:9px}.screen:after{content:"";position:absolute;left:18%;right:18%;bottom:-26px;height:17px;background:#617c8d;border-radius:3px}.mark{position:absolute;left:42%;top:35%;width:60px;height:60px;border-radius:50%;background:#079e9b;color:#fff;display:grid;place-items:center;font-size:35px}@media(max-width:800px){.hero{grid-template-columns:1fr}.visual{min-height:400px}.copy{padding:45px 28px}.copy h1{font-size:45px}}</style></head><body><header class="bar"><div class="brand">منصة إعداد وتقييم البحوث العلمية</div><a class="back" href="./index.html">العودة إلى الرئيسية</a></header><main class="hero"><section class="copy"><h1>المرجع التدريبي 📘</h1><p>دليل عملي لإعداد البحث العلمي واجتياز معايير التقييم</p></section><section class="visual"><div class="screen"><div class="mark">✓</div></div><div class="books"><div class="book one"></div><div class="book two"></div><div class="book three"></div></div></section></main></body></html>
